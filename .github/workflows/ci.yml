# CI for the wordpress/abilities package.
#
# Static jobs run the WP0/WP1 dev tooling (PHP 8.4, matching composer.lock).
# The phpunit job matrix boots both wp-env configs (.wp-env.trunk.json /
# .wp-env.stable.json) and runs the suite inside each container, plus an
# API-off guard run simulating a stable host without the Abilities API.

name: CI

on:
  push:
  pull_request:

jobs:
  phpcs:
    name: WPCS (WordPress-Core ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPCS
        run: composer run lint:phpcs

  phpstan:
    name: PHPStan (with phpstan-wordpress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPStan
        run: composer run lint:phpstan

  verify-manifest:
    name: Verify manifest (placeholder; enforcement lives in ManifestTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest
        run: php bin/verify-manifest.php

  phpunit:
    name: PHPUnit (wp-env: ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: [trunk, stable]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP (host-side tooling)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node (wp-env runner)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Start wp-env (WordPress ${{ matrix.wp }})
        run: npx @wordpress/env start --config=.wp-env.${{ matrix.wp }}.json --update

      # The package is mounted (mapping, not a plugin: composer type=library)
      # at wp-content/plugins/wordpress-abilities; --env-cwd paths without a
      # leading slash resolve against the WP root (verified in wp-env docs).
      - name: Run PHPUnit suite
        run: npx @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wordpress-abilities vendor/bin/phpunit

      # API-absence guard: re-runs the guard test without the fixture API.
      # On the stable env this exercises the missing-API branch; on trunk the
      # API is baked into core and the test self-skips (documented).
      - name: Run API-absence guard test (API off)
        run: npx @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wordpress-abilities env WP_ABILITIES_TESTS_API=off vendor/bin/phpunit --filter=missing_api_guard